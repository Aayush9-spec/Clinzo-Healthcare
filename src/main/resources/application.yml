spring:
  application: { name: clinzo-scheduling }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinzo}
    username: ${SPRING_DATASOURCE_USERNAME:clinzo}
    password: ${SPRING_DATASOURCE_PASSWORD:clinzo}
  jpa:
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
    open-in-view: false
  flyway: { enabled: true }
  jackson:
    serialization: { write-dates-as-timestamps: false }
    time-zone: UTC
server:
  error: { include-message: never }
springdoc:
  api-docs: { path: /api-docs }
  swagger-ui: { path: /swagger-ui.html }
management:
  endpoints: { web: { exposure: { include: health,info } } }
logging:
  level: { com.clinzo: INFO }
